<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Distance to the destinations</title>
  <desc id="desc">Price fall required to reach each valuation destination. The raw Q has two: Q=1 reference and its 1995 trough.</desc>
  <style>text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg { fill: #f5f2ed; }
    .heading { fill: #3a3432; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
    .subhead { fill: #6b7280; font-size: 13px; }
    .panel-title { fill: #3a3432; font-size: 15px; font-weight: 600; }
    .latest { fill: #3a3432; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .plot { fill: none; stroke: rgba(75, 85, 99, 0.18); }
    .grid { stroke: rgba(75, 85, 99, 0.15); stroke-width: 1; }
    .tick { fill: #6b7280; font-size: 12px; font-variant-numeric: tabular-nums; }
    .line { fill: none; stroke: #3b82f6; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .quartile { stroke-width: 1; stroke-dasharray: 5 5; }
    .quartile.q1 { stroke: #c86464; }
    .quartile.q3 { stroke: #64a864; }
    .quartile-label { font-size: 12px; }
    .quartile-label.q1 { fill: #c86464; }
    .quartile-label.q3 { fill: #64a864; }
    .row-label { fill: #3a3432; font-size: 14px; font-weight: 600; }
    .row-detail { fill: #6b7280; font-size: 12px; }
    .stem { stroke: #9aa6b8; stroke-width: 2; }
    .stem.accent { stroke: #b86e3b; }
    .dot { fill: #3b82f6; }
    .dot.accent { fill: #b86e3b; }
    .fall { fill: #3a3432; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .foot { fill: #6b7280; font-size: 12px; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1b1e; }
      .heading, .panel-title, .latest, .row-label, .fall { fill: #e5dfd7; }
      .subhead, .tick, .row-detail, .foot { fill: #9ca3af; }
      .plot { stroke: rgba(209, 213, 219, 0.2); }
      .grid { stroke: rgba(209, 213, 219, 0.15); }
      .quartile.q1 { stroke: #f87171; }
      .quartile.q3 { stroke: #4ade80; }
      .quartile-label.q1 { fill: #f87171; }
      .quartile-label.q3 { fill: #4ade80; }
      .stem { stroke: #6b7280; }
      .stem.accent { stroke: #cc8850; }
      .dot.accent { fill: #cc8850; }
    }</style>

  <rect width="900" height="410" class="bg"/>
  <text x="42" y="40" class="heading">Distance to the destinations</text>
  <text x="42" y="66" class="subhead">Price fall required to reach each valuation destination. The raw Q has two: Q=1 reference and its 1995 trough.</text>
  <line x1="258.0" y1="106" x2="258.0" y2="342" class="grid"/>
  <text x="258.0" y="366" class="tick" text-anchor="middle">0%</text>
  <line x1="339.5" y1="106" x2="339.5" y2="342" class="grid"/>
  <text x="339.5" y="366" class="tick" text-anchor="middle">10%</text>
  <line x1="421.1" y1="106" x2="421.1" y2="342" class="grid"/>
  <text x="421.1" y="366" class="tick" text-anchor="middle">20%</text>
  <line x1="502.6" y1="106" x2="502.6" y2="342" class="grid"/>
  <text x="502.6" y="366" class="tick" text-anchor="middle">30%</text>
  <line x1="584.2" y1="106" x2="584.2" y2="342" class="grid"/>
  <text x="584.2" y="366" class="tick" text-anchor="middle">40%</text>
  <line x1="665.7" y1="106" x2="665.7" y2="342" class="grid"/>
  <text x="665.7" y="366" class="tick" text-anchor="middle">50%</text>
  <line x1="747.2" y1="106" x2="747.2" y2="342" class="grid"/>
  <text x="747.2" y="366" class="tick" text-anchor="middle">60%</text>
  <text x="240" y="142" class="row-label" text-anchor="end">Price-to-income</text>
  <text x="240" y="162" class="row-detail" text-anchor="end">1996 trough, 0.046</text>
  <line x1="258.0" y1="144" x2="738.3" y2="144" class="stem"/>
  <circle cx="738.3" cy="144" r="6" class="dot"/>
  <text x="752.3" y="148" class="fall">59%</text>
  <text x="240" y="198" class="row-label" text-anchor="end">Raw Q</text>
  <text x="240" y="218" class="row-detail" text-anchor="end">Q=1 reference, 1.00</text>
  <line x1="258.0" y1="200" x2="685.7" y2="200" class="stem accent"/>
  <circle cx="685.7" cy="200" r="6" class="dot accent"/>
  <text x="699.7" y="204" class="fall">52%</text>
  <text x="240" y="254" class="row-label" text-anchor="end">Raw Q</text>
  <text x="240" y="274" class="row-detail" text-anchor="end">1995 trough, 1.71</text>
  <line x1="258.0" y1="256" x2="534.3" y2="256" class="stem"/>
  <circle cx="534.3" cy="256" r="6" class="dot"/>
  <text x="548.3" y="260" class="fall">34%</text>
  <text x="240" y="310" class="row-label" text-anchor="end">Detrended Q</text>
  <text x="240" y="330" class="row-detail" text-anchor="end">1995 trough, 0.94</text>
  <line x1="258.0" y1="312" x2="462.3" y2="312" class="stem"/>
  <circle cx="462.3" cy="312" r="6" class="dot"/>
  <text x="476.3" y="316" class="fall">25%</text>

  <text x="42" y="392" class="subhead">Source: OECD, ABS and RBA. Definitions as in the post.</text>
</svg>
