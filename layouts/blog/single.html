{{ define "main" }}
<main class="container blog-container">
  <h2>{{ .Title }}</h2>
  <p class="description"><i>{{ .Description }}</i></p>
  <p class="date">
    {{ .Date.Format "January 2, 2006" }} —
    <a href="https://shanehull.com">Shane Hull</a>
  </p>
  {{ .TableOfContents }}
  {{ .Content }}
  <nav class="back-nav">
    <a href="/blog/" class="back-link">&larr; Blog</a>
  </nav>
</main>
{{ end }}
