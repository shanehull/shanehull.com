{{ define "main" }}
<main class="container">
  <h1>{{ .Title }}</h1>
  <p class="description"><i>{{ .Description }}</i></p>
  <hr />

  <div class="tool-instructions">{{ .Content }}</div>

  <div class="chart-tool-wrapper">
    <div class="chart-controls" id="chart-controls">
      <div class="control-group">
        <label>Time Range:</label>
        <div class="button-group">
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="max"
              checked
              hx-get="/m4-nonfarm/chart"
              hx-target="#chart-inner"
              hx-include="#chart-controls"
              hx-swap="innerHTML"
              hx-trigger="load delay:200ms, change"
            />
            Max
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="50y"
              hx-get="/m4-nonfarm/chart"
              hx-target="#chart-inner"
              hx-include="#chart-controls"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            50 Year
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="20y"
              hx-get="/m4-nonfarm/chart"
              hx-target="#chart-inner"
              hx-include="#chart-controls"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            20 Year
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="10y"
              hx-get="/m4-nonfarm/chart"
              hx-target="#chart-inner"
              hx-include="#chart-controls"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            10 Year
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="5y"
              hx-get="/m4-nonfarm/chart"
              hx-target="#chart-inner"
              hx-include="#chart-controls"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            5 Year
          </label>
        </div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="chart-canvas"></canvas>
      <div id="chart-inner"></div>
    </div>

    <div
      id="chart-downloads"
      hx-get="/m4-nonfarm/downloads"
      hx-include="#chart-controls"
      hx-trigger="load, change from:#chart-controls input"
      hx-swap="innerHTML"
    ></div>
  </div>

  <nav class="back-nav">
    <a href="/tools/" class="back-link">&larr; Tools</a>
  </nav>
</main>

{{ end }}
