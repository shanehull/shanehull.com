{{ define "main" }}
<main class="container">
  <h1>{{ .Title }}</h1>
  <p class="description"><i>{{ .Description }}</i></p>
  <hr />

  <div class="chart-tool-wrapper">
    <div class="chart-controls" hx-indicator="#chart-spinner">
      <div class="control-group">
        <label>Time Range:</label>
        <div class="button-group">
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="max"
              checked
              hx-get="/buffett-indicator/chart"
              hx-target="#chart-inner"
              hx-include="[name=average],[name=debt]"
              hx-swap="innerHTML"
              hx-trigger="load delay:200ms, change"
            />
            Max
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="50y"
              hx-get="/buffett-indicator/chart"
              hx-target="#chart-inner"
              hx-include="[name=average],[name=debt]"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            50 Year
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="20y"
              hx-get="/buffett-indicator/chart"
              hx-target="#chart-inner"
              hx-include="[name=average],[name=debt]"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            20 Year
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="10y"
              hx-get="/buffett-indicator/chart"
              hx-target="#chart-inner"
              hx-include="[name=average],[name=debt]"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            10 Year
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="5y"
              hx-get="/buffett-indicator/chart"
              hx-target="#chart-inner"
              hx-include="[name=average],[name=debt]"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            5 Year
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="1y"
              hx-get="/buffett-indicator/chart"
              hx-target="#chart-inner"
              hx-include="[name=average],[name=debt]"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            1 Year
          </label>
        </div>
      </div>

      <div class="control-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            name="average"
            checked
            hx-get="/buffett-indicator/chart"
            hx-target="#chart-inner"
            hx-include="[name=range],[name=debt]"
            hx-swap="innerHTML"
            hx-trigger="change"
          />
          Show Average
        </label>
      </div>

      <div class="control-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            name="debt"
            checked
            hx-get="/buffett-indicator/chart"
            hx-target="#chart-inner"
            hx-include="[name=range],[name=average]"
            hx-swap="innerHTML"
            hx-trigger="change"
          />
          Adjust for Federal Debt
        </label>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="chart-canvas"></canvas>
      <div id="chart-inner"></div>
      <div id="chart-spinner" class="chart-spinner" aria-hidden="true"></div>
    </div>

    <div
      id="chart-downloads"
      hx-get="/buffett-indicator/downloads"
      hx-include="[name=range],[name=average],[name=debt]"
      hx-trigger="load, change from:[name=range], change from:[name=average], change from:[name=debt]"
      hx-swap="innerHTML"
    ></div>
  </div>

  <div class="tool-instructions">{{ .Content }}</div>

  <nav class="back-nav">
    <a href="/tools/" class="back-link">&larr; Tools</a>
  </nav>
</main>

{{ end }}
