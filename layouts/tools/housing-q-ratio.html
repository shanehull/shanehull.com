{{ define "main" }}
<main class="container">
  <h1>{{ .Title }}</h1>
  <p class="description"><i>{{ .Description }}</i></p>
  <hr />

  <div class="chart-tool-wrapper">
    <div class="chart-controls">
      <div class="control-group">
        <label>Time Range:</label>
        <div class="button-group">
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="max"
              checked
              hx-get="/housing-q-ratio/chart"
              hx-target="#chart-inner"
              hx-include="[name=detrend]"
              hx-swap="innerHTML"
              hx-trigger="load delay:200ms, change"
            />
            Max
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="20y"
              hx-get="/housing-q-ratio/chart"
              hx-target="#chart-inner"
              hx-include="[name=detrend]"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            20 Year
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="10y"
              hx-get="/housing-q-ratio/chart"
              hx-target="#chart-inner"
              hx-include="[name=detrend]"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            10 Year
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="range"
              value="5y"
              hx-get="/housing-q-ratio/chart"
              hx-target="#chart-inner"
              hx-include="[name=detrend]"
              hx-swap="innerHTML"
              hx-trigger="change"
            />
            5 Year
          </label>
        </div>
      </div>

      <div class="control-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            name="detrend"
            checked
            hx-get="/housing-q-ratio/chart"
            hx-target="#chart-inner"
            hx-include="[name=range], input[name=detrend]"
            hx-swap="innerHTML"
            hx-trigger="change"
          />
          Detrended
        </label>
        <input type="hidden" name="detrend" value="off" />
      </div>
    </div>

    <div class="chart-container">
      <canvas id="chart-canvas"></canvas>
      <div id="chart-inner"></div>
    </div>

    <div
      id="chart-downloads"
      hx-get="/housing-q-ratio/downloads"
      hx-include="[name=range],[name=detrend]"
      hx-trigger="load, change from:[name=range], change from:input[name=detrend]"
      hx-swap="innerHTML"
    ></div>
  </div>

  <div class="tool-instructions">{{ .Content }}</div>

  <nav class="back-nav">
    <a href="/tools/" class="back-link">&larr; Tools</a>
  </nav>
</main>

{{ end }}
